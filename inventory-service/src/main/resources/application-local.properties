# Profile cho chạy trực tiếp trên localhost (./gradlew bootRun)
spring.application.name=inventory-service
server.port=8083

# Database (PostgreSQL trong Docker, nhưng chạy từ host máy)
spring.datasource.url=jdbc:postgresql://localhost:5435/inventory_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka (discovery-server trong Docker)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
