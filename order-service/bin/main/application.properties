# 1. Định danh Service & Cổng chạy độc lập (Tránh xung đột với cổng 8081 của Product)
spring.application.name=order-service
server.port=8082

# 2. Cấu hình kết nối PostgreSQL (Trỏ thẳng về cục DB Order vừa tạo)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_order_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Cấu hình Hibernate tự động sinh bảng dữ liệu từ Code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. Địa chỉ tổng đài Eureka Server để dịch vụ tự động đăng ký danh hiệu
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin-server:9411/api/v2/spans