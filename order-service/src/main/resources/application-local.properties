# Profile cho chạy trực tiếp trên localhost (./gradlew bootRun)
spring.application.name=order-service
server.port=8082

# Database (PostgreSQL trong Docker, nhưng chạy từ host máy)
spring.datasource.url=jdbc:postgresql://localhost:5434/order_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka (discovery-server trong Docker)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Custom property cho Inventory Service URL (chạy localhost)
inventory.service.url=http://localhost:8083
